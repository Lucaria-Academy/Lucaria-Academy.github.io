<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>UniSpark | Create, edit, and continue</title>
  <style>
    @font-face { font-family: Manrope; src: url("assets/manrope-regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
    @font-face { font-family: Manrope; src: url("assets/manrope-semibold.ttf") format("truetype"); font-weight: 600; font-display: swap; }
    /* Native CSS artwork. Variance 4 / motion 1 / density 5.
       Complete project outputs retain their original aspect ratios.
       Black canvas follows the supplied reference; labels identify real tasks. */
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #000; color: #fff; }
    .card { container-type: inline-size; width: 100%; aspect-ratio: 45 / 31; background: #000; font-family: Manrope, Arial, sans-serif; }
    .composition { padding: 3.55556cqw; }
    .brands { display: flex; align-items: center; justify-content: space-between; gap: 3cqw; margin-bottom: 2.66667cqw; }
    h1 { margin: 0; font-size: 4.66667cqw; font-weight: 600; line-height: 1.16; letter-spacing: -.22cqw; }
    .subtitle { margin: .77778cqw 0 0; color: #b9b9bd; font-size: 1.22222cqw; line-height: 1.5; }
    .institute { display: block; width: 18.33333cqw; height: auto; }
    h2 { margin: 0 0 1cqw; font-size: 1.55556cqw; line-height: 1.4; font-weight: 600; letter-spacing: -.035cqw; }
    figure { margin: 0; min-width: 0; }
    img { display: block; width: 100%; height: auto; }
    .gallery { display: grid; grid-template-columns: .75fr 1.333333fr 1.333333fr 1fr 1fr; gap: 1.11111cqw; }
    .gallery img { object-fit: contain; }
    figcaption { margin-top: .66667cqw; font-size: 1.11111cqw; line-height: 1.5; color: #c9c9cd; }
    .lower { display: grid; grid-template-columns: 620fr 1004fr; gap: 2.66667cqw; margin-top: 2.22222cqw; }
    .lower h2 { margin-bottom: .38889cqw; }
    .description { margin: 0 0 1.11111cqw; color: #a8a8ae; font-size: 1.11111cqw; line-height: 1.5; }
    .edit { display: grid; grid-template-columns: 1fr 1fr; gap: 2.22222cqw; position: relative; }
    .edit::after { content: "→"; position: absolute; left: 50%; top: 43%; transform: translateX(-50%); font-size: 1.33333cqw; color: #b9b9bd; }
    .edit img { aspect-ratio: 3 / 4; object-fit: contain; }
    .sequence { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .77778cqw; }
    .sequence-caption + .sequence { margin-top: 1cqw; }
    .sequence img { aspect-ratio: 3 / 2; object-fit: contain; }
    .sequence figure { position: relative; }
    .sequence figure:not(:last-child)::after { content: "›"; position: absolute; right: -.61cqw; top: 45%; font-size: 1cqw; line-height: 1; color: #aaa; }
    .sequence-caption { color: #c9c9cd; font-size: 1.11111cqw; line-height: 1.5; margin: .66667cqw 0 0; }
    @media print {
      @page { size: 1800px 1240px; margin: 0; }
      html { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <main class="card" aria-label="UniSpark generation, editing, and interleaved prediction showcase">
    <div class="composition">
      <header class="brands">
        <div>
          <h1>UniSpark</h1>
          <p class="subtitle">Hybrid attention for multimodal understanding and generation</p>
        </div>
        <img class="institute" src="assets/ant-research.png" width="264" height="78" alt="Ant Research">
      </header>
      <section aria-labelledby="generation-title">
        <h2 id="generation-title">Text-to-image generation</h2>
        <div class="gallery">
          <figure><img src="assets/short-hair-portrait.jpg" width="900" height="1200" alt="Portrait of a woman in a black turtleneck"><figcaption>People</figcaption></figure>
          <figure><img src="assets/g95-white-courtyard.jpg" width="1024" height="768" alt="Sunlit courtyard with three arches"><figcaption>Architecture</figcaption></figure>
          <figure><img src="assets/fox.jpg" width="1200" height="900" alt="Red fox in a frosty meadow"><figcaption>Nature</figcaption></figure>
          <figure><img src="assets/g95-blue-bowl.jpg" width="896" height="896" alt="Blue glazed ceramic bowl and a lemon"><figcaption>Objects</figcaption></figure>
          <figure><img src="assets/g95-risograph-cactus.jpg" width="896" height="896" alt="Cactus rendered as a risograph illustration"><figcaption>Art & illustration</figcaption></figure>
        </div>
      </section>
      <div class="lower">
        <section aria-labelledby="editing-title">
          <h2 id="editing-title">Instruction-guided editing</h2>
          <p class="description">Change the liquid from green to amber.</p>
          <div class="edit">
            <figure><img src="assets/perfume-edit-before.jpg" width="768" height="1024" alt="Source: green perfume liquid in a glass bottle"><figcaption>Source image</figcaption></figure>
            <figure><img src="assets/perfume-edit-after.jpg" width="768" height="1024" alt="Edited: amber perfume liquid in the same bottle and scene"><figcaption>Edited result</figcaption></figure>
          </div>
        </section>
        <section aria-labelledby="sequence-title">
          <h2 id="sequence-title">Interleaved generation</h2>
          <p class="description">Carry visual context across successive images.</p>
          <div class="sequence" aria-label="Four successive images of a kitten playing with yarn">
            <figure><img src="assets/kitten-1.jpg" width="1200" height="800" alt="Kitten and yarn, first output"></figure>
            <figure><img src="assets/kitten-2.jpg" width="1200" height="800" alt="Kitten and yarn, second output"></figure>
            <figure><img src="assets/kitten-3.jpg" width="1200" height="800" alt="Kitten and yarn, third output"></figure>
            <figure><img src="assets/kitten-4.jpg" width="1200" height="800" alt="Kitten and yarn, fourth output"></figure>
          </div>
          <p class="sequence-caption">Kitten & yarn</p>
          <div class="sequence" aria-label="Four successive images of coastal waves">
            <figure><img src="assets/surf-1.jpg" width="1200" height="800" alt="Coastal waves, first output"></figure>
            <figure><img src="assets/surf-2.jpg" width="1200" height="800" alt="Coastal waves, second output"></figure>
            <figure><img src="assets/surf-3.jpg" width="1200" height="800" alt="Coastal waves, third output"></figure>
            <figure><img src="assets/surf-4.jpg" width="1200" height="800" alt="Coastal waves, fourth output"></figure>
          </div>
          <p class="sequence-caption">Coastal waves</p>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
